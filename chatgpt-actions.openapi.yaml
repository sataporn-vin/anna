        occurredOn:
          type: string
          format: date
        occurredAt:
          description: Optional MongoDB Extended JSON date-time.
        timezone:
          type: string
        title:
          type: string
        eventType:
          $ref: "#/components/schemas/EventType"
        location:
          description: Location string or null.
        people:
