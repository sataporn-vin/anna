openapi: 3.1.0
info:
  title: Anna Personal Memory
  description: >-
    Complete Anna REST API for accounts, payment channels, transactions,
    completed life-log events, reminders, collections, and constrained MongoDB
    operations. Dates are local calendar dates in YYYY-MM-DD format.
  version: 1.1.0
servers:
  - url: https://anna-production-bfb9.up.railway.app
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check process liveness
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /health/ready:
    get:
      operationId: getReadiness
      summary: Check database readiness
      security: []
      responses:
        "200":
          description: The service and database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: The database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /v1/collections:
    get:
      operationId: listCollections
      summary: List accessible collections
      responses:
        "200":
          description: Accessible managed and flexible collections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createCollection
      summary: Create a flexible collection
      description: Managed collection names cannot be created through this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "200":
          description: The collection already existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCollectionResponse"
        "201":
          description: The collection was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCollectionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/accounts:
    post:
      operationId: createAccount
      summary: Create a financial account
      description: >-
        Create an account only after the user explicitly confirms its identity,
        kind, and currency. Transactions can reference the returned account ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/payment-channels:
    post:
      operationId: createPaymentChannel
      summary: Create a payment channel
      description: >-
        Create an intermediary such as TrueMoney Wallet or LINE Pay. A payment
        channel is distinct from the account charged for the transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentChannelRequest"
      responses:
        "201":
          description: The payment channel was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePaymentChannelResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/mongo/find:
    post:
      operationId: findDocuments
      summary: Find documents in an accessible collection
      description: Uses constrained MongoDB Extended JSON filters, projection, and sort.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindRequest"
      responses:
        "200":
          description: Matching documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentsResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/mongo/find-one:
    post:
      operationId: findOneDocument
      summary: Find one document in an accessible collection
      description: Uses constrained MongoDB Extended JSON filters, projection, and sort.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindRequest"
      responses:
        "200":
          description: The matching document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/mongo/insert-one:
    post:
      operationId: insertOneDocument
      summary: Insert into a flexible collection
      description: Generic writes to managed collections are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertOneRequest"
      responses:
        "201":
          description: The document was inserted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/mongo/update-one:
    post:
      operationId: updateOneDocument
      summary: Update one document in a flexible collection
      description: Generic writes to managed collections are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOneRequest"
      responses:
        "200":
          description: Update counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateOneResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/mongo/delete-one:
    post:
      operationId: deleteOneDocument
      summary: Delete one document from a flexible collection
      description: Generic writes to managed collections are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteOneRequest"
      responses:
        "200":
          description: Delete count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteOneResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/mongo/aggregate:
    post:
      operationId: aggregateDocuments
      summary: Run a constrained aggregation
      description: Uses the server's allowlisted MongoDB aggregation stages and expressions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AggregateRequest"
      responses:
        "200":
          description: Aggregation results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentsResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/reminders/digest:
    get:
      operationId: getReminderDigest
      summary: Get incomplete reminders for a date
      description: >-
        Retrieve the morning digest. Omit on to use today's date in
        Asia/Bangkok. This operation does not change stored data.
      parameters:
        - name: "on"
          in: query
          required: false
          description: Local calendar date. Omit this parameter for today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Incomplete reminder steps for the requested date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderDigestResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/reminders:
    post:
      operationId: createReminder
      summary: Create a recurring reminder
      description: >-
        Create one recurring reminder rule. Ask the user to resolve ambiguous
        weekdays, start date, timezone, or preparation lead time before calling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminderRequest"
      responses:
        "200":
          description: The reminder already existed and was returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReminderResponse"
        "201":
          description: The reminder was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReminderResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/reminders/completions:
    post:
      operationId: completeReminder
      summary: Complete one reminder step
      description: >-
        Complete one phase of one dated reminder occurrence. occurrenceOn is
        the scheduled occurrence date, including when completing preparation
        before that date. Ask if the occurrence is ambiguous.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteReminderRequest"
      responses:
        "200":
          description: This completion already existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        "201":
          description: The reminder step was completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/transactions:
    post:
      operationId: recordTransaction
      summary: Record a financial transaction
      description: >-
        Record one confirmed financial event. amountMinor uses the currency's
        minor unit, so THB 205 is 20500. Generate a new UUID requestId for a new
        transaction and reuse it only when retrying the identical request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "200":
          description: The identical idempotent transaction already existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        "201":
          description: The transaction was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/events:
    post:
      operationId: recordEvent
      summary: Record one completed life-log event
      description: >-
        Record a completed occurrence worth remembering. Monetary context is
        informational and never changes financial totals. Generate a new UUID
        requestId for a new event and reuse it only when retrying the identical
        request. Do not use this operation for a future appointment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "200":
          description: The identical idempotent event already existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        "201":
          description: The event was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/events/search:
    post:
      operationId: searchEvents
      summary: Search completed life-log events
      description: >-
        Search with at least one structured filter. Resolve relative dates such
        as last Friday into absolute local dates before calling. Text search is
        normalized token matching, not fuzzy or semantic search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventSearchRequest"
      responses:
        "200":
          description: Matching events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSearchResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/events/{id}:
    get:
      operationId: getEvent
      summary: Get one event
      parameters:
        - name: id
          in: path
          required: true
          description: Event MongoDB object identifier.
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    patch:
      operationId: updateEvent
      summary: Correct an event
      description: >-
        Apply merge-patch semantics to mutable event fields. Null clears an
        optional field. Server-owned fields and original source text cannot be
        changed.
      parameters:
        - name: id
          in: path
          required: true
          description: Event MongoDB object identifier.
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: The updated event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteEvent
      summary: Delete an event
      description: Delete only the event; linked transactions are unchanged.
      parameters:
        - name: id
          in: path
          required: true
          description: Event MongoDB object identifier.
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
      responses:
        "204":
          description: The event was deleted.
        default:
          $ref: "#/components/responses/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    ErrorResponse:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    CollectionInfo:
      type: object
      additionalProperties: false
      required: [name, managed]
      properties:
        name:
          type: string
        managed:
          type: boolean

    CollectionListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CollectionInfo"
        meta:
          type: object
          required: [count]
          properties:
            count:
              type: integer

    CreateCollectionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"

    CreateCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, created]
      properties:
        data:
          $ref: "#/components/schemas/CollectionInfo"
        created:
          type: boolean

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 100
          description: Stable lowercase kebab-case identifier.
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum: [bank_account, credit_card, cash, wallet, other]
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          default: THB

    Account:
      type: object
      additionalProperties: false
      required: [id, name, kind, currency, active]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [bank_account, credit_card, cash, wallet, other]
        currency:
          type: string
        active:
          type: boolean

    CreateAccountResponse:
      type: object
      additionalProperties: false
      required: [data, created]
      properties:
        data:
          $ref: "#/components/schemas/Account"
        created:
          type: boolean

    CreatePaymentChannelRequest:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 100
          description: Stable lowercase kebab-case identifier.
        name:
          type: string
          minLength: 1
          maxLength: 200

    PaymentChannel:
      type: object
      additionalProperties: false
      required: [id, name, active]
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean

    CreatePaymentChannelResponse:
      type: object
      additionalProperties: false
      required: [data, created]
      properties:
        data:
          $ref: "#/components/schemas/PaymentChannel"
        created:
          type: boolean

    ExtendedJSONDocument:
      type: object
      description: MongoDB Extended JSON document.
      properties:
        _id:
          description: >-
            Optional MongoDB identifier. Other document and query fields are
            accepted through additionalProperties.
      additionalProperties: true

    FindRequest:
      type: object
      additionalProperties: false
      required: [collection]
      properties:
        collection:
          type: string
        filter:
          $ref: "#/components/schemas/ExtendedJSONDocument"
        projection:
          $ref: "#/components/schemas/ExtendedJSONDocument"
        sort:
          $ref: "#/components/schemas/ExtendedJSONDocument"
        limit:
          type: integer
          minimum: 1

    InsertOneRequest:
      type: object
      additionalProperties: false
      required: [collection, document]
      properties:
        collection:
          type: string
        document:
          $ref: "#/components/schemas/ExtendedJSONDocument"

    UpdateOneRequest:
      type: object
      additionalProperties: false
      required: [collection, filter, update]
      properties:
        collection:
          type: string
        filter:
          $ref: "#/components/schemas/ExtendedJSONDocument"
        update:
          $ref: "#/components/schemas/ExtendedJSONDocument"

    DeleteOneRequest:
      type: object
      additionalProperties: false
      required: [collection, filter]
      properties:
        collection:
          type: string
        filter:
          $ref: "#/components/schemas/ExtendedJSONDocument"

    AggregateRequest:
      type: object
      additionalProperties: false
      required: [collection, pipeline]
      properties:
        collection:
          type: string
        pipeline:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExtendedJSONDocument"

    DocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ExtendedJSONDocument"

    DocumentsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ExtendedJSONDocument"
        meta:
          type: object
          required: [count]
          properties:
            count:
              type: integer

    UpdateOneResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [matchedCount, modifiedCount]
          properties:
            matchedCount:
              type: integer
            modifiedCount:
              type: integer

    DeleteOneResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [deletedCount]
          properties:
            deletedCount:
              type: integer

    ReminderDigestResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ReminderDigestItem"
        meta:
          type: object
          required: [count, "on"]
          properties:
            count:
              type: integer
            "on":
              type: string
              format: date

    ReminderDigestItem:
      type: object
      required: [reminderId, occurrenceOn, phase, title]
      properties:
        reminderId:
          type: string
        occurrenceOn:
          type: string
          format: date
        phase:
          type: string
          enum: [preparation, occurrence]
        title:
          type: string

    CreateReminderRequest:
      type: object
      additionalProperties: false
      required: [id, title, weekdays]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 100
          description: Stable lowercase kebab-case identifier.
        title:
          type: string
          minLength: 1
          maxLength: 300
        timezone:
          type: string
          default: Asia/Bangkok
          description: IANA timezone.
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: string
            enum:
              - monday
              - tuesday
              - wednesday
              - thursday
              - friday
              - saturday
              - sunday
        startsOn:
          type: string
          format: date
          description: Omit to start today in the reminder timezone.
        preparation:
          $ref: "#/components/schemas/ReminderPreparation"

    ReminderPreparation:
      type: object
      additionalProperties: false
      required: [title, leadDays]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        leadDays:
          type: integer
          minimum: 1
          maximum: 30
          description: >-
            Start showing preparation this many days before the occurrence and
            repeat it daily through the day before while incomplete.

    CreateReminderResponse:
      type: object
      required: [created, data]
      properties:
        created:
          type: boolean
        data:
          type: object
          required: [id, title, timezone, weekdays, startsOn, active]
          properties:
            id:
              type: string
            title:
              type: string
            timezone:
              type: string
            weekdays:
              type: array
              items:
                type: string
            startsOn:
              type: string
              format: date
            preparation:
              $ref: "#/components/schemas/ReminderPreparation"
            active:
              type: boolean

    CompleteReminderRequest:
      type: object
      additionalProperties: false
      required: [reminderId, occurrenceOn, phase]
      properties:
        reminderId:
          type: string
          description: Stable reminder rule identifier.
        occurrenceOn:
          type: string
          format: date
          description: Scheduled date of the reminder occurrence.
        phase:
          type: string
          enum: [preparation, occurrence]

    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - occurredOn
        - amountMinor
        - transactionKind
        - accountId
      properties:
        requestId:
          type: string
          format: uuid
        occurredOn:
          type: string
          format: date
        occurredAt:
          type: string
          format: date-time
          description: Include only when the user supplied an actual time.
        timezone:
          type: string
          default: Asia/Bangkok
        amountMinor:
          type: integer
          minimum: 1
          description: Positive amount in the currency's minor unit.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          default: THB
        transactionKind:
          type: string
          enum: [expense, income, refund, credit_card_payment, transfer]
        accountId:
          type: string
          description: Existing Anna account identifier, such as kbank-saving.
        paymentChannelId:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 100
          description: >-
            Optional existing payment-channel identifier, such as
            truemoney-wallet. This is distinct from accountId.
        descriptorRaw:
          type: string
          maxLength: 1000
          description: Required by Anna unless transactionKind is income.
        merchantName:
          type: string
          maxLength: 300
        categoryPath:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 100
        note:
          type: string
          maxLength: 5000
        rawText:
          type: string
          maxLength: 5000
          description: Preserve the user's original transaction message.

    EventType:
      type: string
      enum:
        - company-event
        - social-event
        - meal-gathering
        - appointment-completed
        - travel
        - celebration
        - personal-milestone
        - work-milestone
        - health-fitness
        - pet
        - family
        - general-memory

    EventFinancialContext:
      type: object
      additionalProperties: false
      required: [currency]
      minProperties: 2
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        totalValueMinor:
          type: integer
          minimum: 0
        allowanceMinor:
          type: integer
          minimum: 0
        coveredByOthersMinor:
          type: integer
          minimum: 0
        personalPaymentMinor:
          type: integer
          minimum: 0
          description: Zero only when the source explicitly says the user paid nothing.

    EventAttributeScalar:
      oneOf:
        - type: string
          maxLength: 1000
        - type: number
        - type: boolean
        - type: "null"

    EventAttributeValue:
      oneOf:
        - $ref: "#/components/schemas/EventAttributeScalar"
        - type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/EventAttributeScalar"

    EventAttributes:
      type: object
      maxProperties: 32
      description: >-
        Guarded event-specific extension data. Keys cannot start with a dollar
        sign or contain a dot. Values are short JSON scalars or scalar arrays.
        The listed keys are examples; descriptive additional keys are allowed.
      properties:
        restaurantChain:
          $ref: "#/components/schemas/EventAttributeValue"
        occasion:
          $ref: "#/components/schemas/EventAttributeValue"
        department:
          $ref: "#/components/schemas/EventAttributeValue"
      additionalProperties:
        $ref: "#/components/schemas/EventAttributeValue"

    CreateEventRequest:
      type: object
      additionalProperties: false
      required: [requestId, occurredOn, title, rawText]
      properties:
        requestId:
          type: string
          format: uuid
        occurredOn:
          type: string
          format: date
          description: Completed local date; future dates are rejected.
        occurredAt:
          type: string
          format: date-time
          description: Include only when the user supplied an actual time.
        timezone:
